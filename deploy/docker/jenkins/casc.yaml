jenkins:
  systemMessage: "Watermelon CI managed Jenkins — jobs are controlled by the platform"
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  crumbIssuer: "standard"
  remotingSecurity:
    enabled: true

unclassified:
  location:
    url: http://localhost:8082/

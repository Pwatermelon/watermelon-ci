services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: watermelon
      POSTGRES_USER: watermelon
      POSTGRES_PASSWORD: watermelon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watermelon -d watermelon"]
      interval: 5s
      timeout: 5s
      retries: 10

  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__database__PATH: /data/forgejo.db
      FORGEJO__server__ROOT_URL: http://localhost:3000/
      FORGEJO__security__INSTALL_LOCK: "true"
    ports:
      - "3000:3000"
    volumes:
      - forgejo-data:/data

  jenkins:
    build:
      context: ./deploy/docker/jenkins
      dockerfile: Dockerfile
    privileged: true
    user: root
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Djenkins.model.Jenkins.slaveAgentPort=50000"
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc.yaml
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins-home:/var/jenkins_home
      - ./deploy/docker/jenkins/casc.yaml:/var/jenkins_home/casc.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - registry
      - demo-vm-a
      - demo-vm-b
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  registry:
    image: registry:2
    ports:
      - "5001:5000"
    volumes:
      - registry-data:/var/lib/registry

  # Demo «виртуалки»: Docker-in-Docker, регистрируются как WorkerNode
  demo-vm-a:
    image: docker:27-dind
    privileged: true
    hostname: demo-vm-a
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - dockerd-entrypoint.sh
      - --host=tcp://0.0.0.0:2375
      - --insecure-registry=registry:5000
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      - registry

  demo-vm-b:
    image: docker:27-dind
    privileged: true
    hostname: demo-vm-b
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - dockerd-entrypoint.sh
      - --host=tcp://0.0.0.0:2375
      - --insecure-registry=registry:5000
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      - registry

  nexus:
    image: sonatype/nexus3:3.70.1
    ports:
      - "8084:8081"
    volumes:
      - nexus-data:/nexus-data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40

  vault:
    image: hashicorp/vault:1.17
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    command: server -dev

  # Lightweight Argo CD API placeholder for local stacks.
  # Production: point watermelon.gitops.argo-cd.base-url at a real Argo CD server.
  argocd:
    image: argoproj/argocd:v2.12.3
    command: ["argocd-server", "--insecure", "--dex-server", "", "--repo-server", ""]
    environment:
      ARGOCD_SERVER_INSECURE: "true"
    ports:
      - "8089:8080"
    profiles: ["full"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8083"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8083
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8083
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8083:8083"
    volumes:
      - ./deploy/keycloak/realm-watermelon.json:/opt/keycloak/data/import/realm-watermelon.json:ro
      - ./deploy/keycloak/theme/watermelon:/opt/keycloak/themes/watermelon:ro

  watermelon-ci:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_started
      keycloak:
        condition: service_started
      demo-vm-a:
        condition: service_healthy
      demo-vm-b:
        condition: service_healthy
      registry:
        condition: service_started
      jenkins:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: watermelon
      POSTGRES_USER: watermelon
      POSTGRES_PASSWORD: watermelon
      JENKINS_URL: http://jenkins:8080
      JENKINS_USER: admin
      JENKINS_TOKEN: admin
      FORGEJO_URL: http://forgejo:3000
      DOCKER_REGISTRY_URL: http://registry:5000
      DOCKER_REGISTRY_PUSH_HOST: registry:5000
      MAVEN_REPO_URL: http://nexus:8081/repository/maven-releases/
      DOCKER_ENGINE_ENABLED: "true"
      DOCKER_ENGINE_URL: http://demo-vm-a:2375
      DEMO_VM_A_URL: http://demo-vm-a:2375
      DEMO_VM_B_URL: http://demo-vm-b:2375
      DEMO_SEED_RUNTIME: "true"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      GITOPS_DRY_RUN: "true"
      GITOPS_REPO_PATH: /data/gitops
      ARGOCD_URL: http://argocd:8080
      WATERMELON_AUTH_ENABLED: "false"
      KEYCLOAK_ISSUER_URI: http://localhost:8083/realms/watermelon
      KEYCLOAK_JWK_SET_URI: http://keycloak:8083/realms/watermelon/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URL: http://keycloak:8083/realms/watermelon/protocol/openid-connect/token
      KEYCLOAK_CLIENT_ID: watermelon-console
      GIT_PROVIDER: local
      GIT_LOCAL_ROOT: /data/repos
      JENKINS_SOFT_FAIL: "false"
    ports:
      - "8088:8088"
    volumes:
      - gitops-data:/data/gitops
      - repos-data:/data/repos

volumes:
  pgdata:
  forgejo-data:
  jenkins-home:
  registry-data:
  nexus-data:
  gitops-data:
  repos-data:
